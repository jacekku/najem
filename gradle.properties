# The machine ran out of memory running this build (human ruling, 2026-08-04). Six
# agents in six worktrees means six Gradle daemons, and Gradle sizes both the daemon
# heap and the worker count from the host — so each one helpfully assumed it had the
# whole machine, and together they asked for several times what exists.
#
# The other half of the fix is tools/testq, which lets only one agent run tests at a
# time. These settings shrink what a single run costs; the queue stops runs
# overlapping. Neither is sufficient alone.

# Small enough that several idle daemons cost little, large enough for this build.
org.gradle.jvmargs=-Xmx1g -XX:MaxMetaspaceSize=512m

# Gradle defaults max-workers to the CPU count. Two modules compiling in parallel is
# a fine trade; eight is how one agent's build alone exhausted the machine.
org.gradle.workers.max=2
org.gradle.parallel=false

# Idle daemons are the ones nobody notices. Three hours was the default; twenty
# minutes means an agent that has gone quiet stops holding a heap.
org.gradle.daemon.idletimeout=1200000

# Test JVMs are forked per module and are additive with everything above. Testcontainers
# does the heavy lifting in Docker, so the JVM itself does not need much.
org.gradle.caching=true
