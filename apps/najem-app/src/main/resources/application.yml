spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/najem
    username: najem
    password: najem
  flyway:
    locations: "classpath:db/eventstore,classpath:db/pm,classpath:db/acc,classpath:db/contacts,classpath:db/um,classpath:db/reporting"
    # A missing location is a silent no-op in Flyway: reporting's five tables were absent from
    # every deployment while its own tests provisioned them and stayed green. Failing loudly is
    # the only way a module dropping off the classpath is distinguishable from one that is wired.
    fail-on-missing-locations: true

najem:
  # najem.bank.* is deliberately absent. base-url and iban name an environment, and iban in
  # particular answers "whose money is this?" — a packaged value answers it with one agency's
  # account for every workspace in the system. najem.bank.fake.enabled is absent for the same
  # reason: without it there is no BankStatementPort and the application refuses to start, which
  # is the loud version of what used to be a clean start that reconciled nothing.
  # Supply all three per deployment. PackagedConfigTest fails if any of them returns here.
  keycloak:
    base-url: "http://localhost:8180"
    realm: "najem"
    admin-username: "admin"
    admin-password: "admin"
