spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/najem
    username: najem
    password: najem
  flyway:
    locations: "classpath:db/eventstore,classpath:db/pm,classpath:db/acc,classpath:db/contacts,classpath:db/um,classpath:db/reporting"
    # A missing location is a silent no-op in Flyway: reporting's five tables were absent from
    # every deployment while its own tests provisioned them and stayed green. Failing loudly is
    # the only way a module dropping off the classpath is distinguishable from one that is wired.
    fail-on-missing-locations: true

# There is deliberately no najem.* block. Both halves were removed for the same reason under
# roadmap rule 7, by two agents who arrived at it independently:
#
# najem.bank.* — base-url and iban name an environment, and iban in particular answers "whose
# money is this?" A packaged value answers it with one agency's account for every workspace in the
# system. najem.bank.fake.enabled is absent for the same reason: without it there is no
# BankStatementPort and the application refuses to start, which is the loud version of what used
# to be a clean start that reconciled nothing.
#
# najem.keycloak.* — admin-password shipped as "admin", so a deployment that forgot to override it
# did not fail: it ran with a guessable credential against the identity provider that owns every
# account. Naming a base-url now requires realm, admin-username and admin-password too, or the
# application refuses to start. Setting none of them is still fine and still means local runs get
# a port that refuses to provision rather than one that invents accounts.
#
# Supply each per deployment. The packaged-config guard tests fail if any of them returns here.
