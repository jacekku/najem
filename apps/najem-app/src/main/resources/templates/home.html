<!DOCTYPE html>
<!--/*
  The agency screen, and the application's entry point.

  "Agencja", never "przestrzeń robocza" — the second is a calque of an English implementation word
  for something our own domain model already names, and no Polish estate agent says it. The human's
  founding ruling was workspace = agency = the hard tenancy boundary; the interface uses the word
  the domain uses (najem-build seq 309).
*/-->
<html xmlns:th="http://www.thymeleaf.org" lang="pl"
      th:replace="~{layout :: page('Agencja — NAJEM', ~{::main})}">
<body>
<main>
    <!--/*
      The agency by NAME. The identifier that used to sit here under "Identyfikator" was an
      internal presented as though it were a fact about the agency; `WorkspaceAccess.Membership`
      carries the name as of f36c1bb and this renders it.
    */-->
    <h1 th:text="${agency}">Agencja</h1>

    <p class="role">
        Twoja rola: <strong th:switch="${role}">
            <span th:case="'ADMIN'">Administrator</span>
            <span th:case="'MANAGER'">Zarządca</span>
            <span th:case="*" th:text="${role}">—</span>
        </strong>
    </p>

    <nav class="entry">
        <!--/*
          Only what is wired is a link. A screen that offers a route to nothing is the same failure
          as a number that came from nowhere, and it is worse in front of a person than in a test.
        */-->
        <a th:href="@{/agencies}">Zmień agencję</a>
        <span class="entry__pending">Nieruchomości — wkrótce</span>
        <span class="entry__pending">Bank — wkrótce</span>
        <span class="entry__pending">Raport — wkrótce</span>
    </nav>
</main>
</body>
</html>
