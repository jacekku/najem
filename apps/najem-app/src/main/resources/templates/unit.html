<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="pl"
      th:replace="~{layout :: page('Lokal — NAJEM', null, ~{::main})}">
<body>
<main>
    <!--/*
      Not the breadcrumb fragment: this app has one real, working link back to the unit's own
      property (the original screen's "← Lokale"), and the fragment's own contract is
      deliberately unlinked plain text ("wiring real navigation onto it is a Task 5/6 concern" —
      components.html). Dropping the working link to stay literally inside the fragment call would
      be a navigation regression nothing tests but everybody would notice. Reuses the breadcrumb's
      own CSS class rather than inventing a new one.
    */-->
    <nav class="breadcrumb">
        <a th:href="@{/properties/{id}/units(id=${unit.propertyId()})}">Lokale /</a>
    </nav>

    <!--/*
      Unit + tenancy detail's header, bounded: the status pill beside the title is real (the
      unit's own market state), but the arrears pill the handoff draws there has no data behind
      it on this screen, and neither does a tab strip — Ledger/Tenant/Meters/Documents/
      Maintenance are none of them routes this application has, and this app's own sidebar
      convention (nav__item--unbuilt) never turns an unbuilt destination into a live link, so a
      multi-item tab strip here would need the same treatment the fragment library has no shape
      for. Left out rather than half-built.
    */-->
    <div class="screen-head__title-row">
        <h1 th:text="${unit.name()}">—</h1>
        <!--/*
          Marketing, not occupancy — the two must never be merged. A let unit is legitimately still
          `inventory` because nobody is advertising it; whether it is let is the subtitle below.
          Nested one level deeper than a bare th:case + th:replace — see units.html's own note on
          why the guard and the replace cannot share a tag.
        */-->
        <span th:switch="${unit.marketState()}">
            <span th:case="'open'"><span th:replace="~{components :: pill(tone='paid', text='Ogłoszony')}"></span></span>
            <span th:case="'closed'"><span th:replace="~{components :: pill(tone='neutral', text='Wycofany z oferty')}"></span></span>
            <span th:case="'inventory'"><span th:replace="~{components :: pill(tone='neutral', text='Nieogłoszony')}"></span></span>
            <span th:case="*"><span th:replace="~{components :: pill(tone='neutral', text=${unit.marketState()})}"></span></span>
        </span>
    </div>

    <!--/*
      Stated format, not inherited: Thymeleaf's default takes the separator from the server
      locale, so the same code renders 2,850.00 on one machine and 2 850,00 on another with
      tests green either way. Same reason as the units table.
    */-->
    <p class="muted">
        <span class="mono" th:text="${#numbers.formatDecimal(unit.baseRent(), 1, 'WHITESPACE', 2, 'COMMA')}">—</span>
        <a th:if="${unit.currentTenancyId() != null}"
           th:href="@{/tenancies/{id}/timeline(id=${unit.currentTenancyId()})}">Najem bieżący</a>
        <span th:if="${unit.currentTenancyId() == null}" class="faint-note">Pustostan</span>
        <a th:if="${unit.nextTenancyId() != null}"
           th:href="@{/tenancies/{id}/timeline(id=${unit.nextTenancyId()})}">· nadchodzący</a>
    </p>

    <!--/*
      Card anatomy from Unit + tenancy detail, on this app's real content: who has asked about the
      unit, not the tenancy history / ledger / payment strip the handoff draws for a screen this
      one is not (no data behind any of those here). The body fragment's own root carries no
      `card__body` class, so none of the card's 18px body padding applies — tableHead/table__row
      already carry that padding themselves, the same reasoning as properties.html and units.html.
    */-->
    <!--/*
      Local same-file th:fragment declarations render their content twice — once at the
      declaration site (inert to a browser's DOM inside <template>, but still literal text in the
      raw HTTP response) and once at the th:insert/th:replace call site. property-new.html and
      reports.html found and removed this pattern; these two are its last occurrences. Since
      interestedBody/leadBody are specific to this one screen (not shared the way arrearsPill
      turned out to be), the fix here is local: apply card's own CSS classes (card, card__head,
      card__title, card__body) directly instead of calling components :: card(...) with a
      fragment-expression body param, so the content is written once, in its natural position,
      with no local th:fragment at all.
    */-->
    <div class="card">
        <header class="card__head">
            <h2 class="card__title">Zainteresowani</h2>
            <span class="card__meta" th:text="'(' + ${interested.size()} + ')'">—</span>
        </header>

        <!--/*
          Head and rows scroll together — see properties.html's own note on why.

          `table--stacks` because this table measures 793px against the 680px content area at 768,
          so at that width each row becomes a card, two across (components.css). The trailing
          Rezerwuj/Wycofaj pair is what makes it wide, not the data.

          The column names are declared once, here, and read twice: by `tableHead` for the head and
          by each cell's `data-label` for the stacked form. Two literal copies of the same five
          strings is exactly the drift the `gridClass` indirection already avoids for `--cols`.
          The trailing action column is deliberately left without a `data-label` — its header is
          blank, and a label rendered from an empty string is 2px of margin under a heading that
          says nothing.
        */-->
        <!--/* No `table-scroll`: this table stacks at 768 and fits above it, so there is no width at
               which a horizontal scroll is the right answer — and the class could not have been
               undone anyway, since `.table-scroll`'s `overflow-x: auto` sits in a later cascade layer
               than `.table--stacks`'s `visible`. See bank.html's suggestions table for the whole
               account. */-->
        <div class="unit-interested-table table--stacks"
             th:with="cols=${ {'Osoba','Kontakt','Gotów płacić','Od kiedy',''} }">
        <div th:replace="~{components :: tableHead(columns=${cols}, gridClass='unit-interested-table')}"></div>

        <!--/* th:if + th:replace on one element never fire together (see properties.html's note). */-->
        <div th:if="${interested.isEmpty()}">
            <div th:replace="~{components :: emptyState(text='Nikt jeszcze nie pytał o ten lokal.')}"></div>
        </div>

        <div class="table__row" th:each="party : ${interested}">
            <span th:attr="data-label=${cols[0]}" th:text="${party.fullName()}">—</span>
            <span th:attr="data-label=${cols[1]}">
                <span th:text="${party.email()}">—</span>
                <span class="muted" th:text="${party.phone()}">—</span>
            </span>
            <!--/*
              Both are nullable: somebody who rings to ask what the agency would take has named
              neither, and a dash is the honest rendering of a question that was not answered.
            */-->
            <span class="mono" th:attr="data-label=${cols[2]}">
                <span th:if="${party.willingToPay() != null}"
                      th:text="${#numbers.formatDecimal(party.willingToPay(), 1, 'WHITESPACE', 2, 'COMMA')}">—</span>
                <span th:if="${party.willingToPay() == null}" class="faint-note">—</span>
            </span>
            <!--/*
              Already dd.mm.rrrr by the time this template sees it — UnitScreenController.
              InterestedPartyView formats it in Java, the same reason ReserveScreenController's
              booked-periods list does (this codebase's stated date convention; no
              thymeleaf-extras-java8time on this module's classpath, so #temporals does not exist).
            */-->
            <span class="mono" th:attr="data-label=${cols[3]}">
                <span th:if="${party.desiredStart() != null}" th:text="${party.desiredStart()}">—</span>
                <span th:if="${party.desiredStart() == null}" class="faint-note">—</span>
            </span>
            <span class="table-row-actions">
                <div th:replace="~{components :: btn(href=@{/units/{u}/reserve(u=${unit.unitId()}, interestId=${party.interestId()})}, text='Rezerwuj', kind='primary')}"></div>
                <form th:action="@{/units/{u}/interests/{i}/withdraw(u=${unit.unitId()}, i=${party.interestId()})}"
                      method="post">
                    <div th:replace="~{components :: btn(href=null, text='Wycofaj', kind='danger')}"></div>
                </form>
            </span>
        </div>
        </div>
    </div>

    <div class="card">
        <header class="card__head">
            <h2 class="card__title">Dodaj zainteresowanego</h2>
        </header>
        <!--/*
          Unlike the card above, this body DOES carry card__body — it's prose and a form, not
          a table wanting flush edges against the card's border, so the normal 18px body padding
          is what we want here.
        */-->
        <div class="card__body">
            <!--/*
              A GET, so the search is bookmarkable and the screen keeps one template for all three
              states: nothing asked, hits to pick from, somebody picked. It carries no CSRF token
              because it changes nothing — only the two forms below do. field__input reused
              directly (not the field() fragment, which always renders a label above the input) —
              this is a compact inline search bar, the same shape as the header bar's own search.
            */-->
            <form class="lead-search" th:action="@{/units/{id}(id=${unit.unitId()})}" method="get">
                <input class="field__input" type="search" name="q" th:value="${term}" placeholder="Nazwisko albo imię">
                <div th:replace="~{components :: btn(href=null, text='Szukaj', kind='secondary')}"></div>
            </form>

            <!--/* th:if + th:replace on one element never fire together (see properties.html's note). */-->
            <div th:if="${asked and hits.isEmpty()}">
                <div th:replace="~{components :: emptyState(text='Nikogo takiego jeszcze nie znamy — wpisz dane poniżej.')}"></div>
            </div>

            <ul class="lead-hits" th:unless="${hits.isEmpty()}">
                <li th:each="hit : ${hits}">
                    <a th:href="@{/units/{id}(id=${unit.unitId()}, contactId=${hit.contactId()})}"
                       th:text="${hit.givenName()} + ' ' + ${hit.surname()} + ' — ' + ${hit.email()}">—</a>
                </li>
            </ul>

            <form th:action="@{/units/{id}/interests(id=${unit.unitId()})}" method="post">
                <!--/*
                  Two shapes of the same form. With somebody picked, the person is settled and only
                  the two facts about the call remain; without, the manager describes them.
                  Rendering both at once would let a form both name a person and describe a
                  different one.
                */-->
                <div th:if="${chosen != null}" class="lead-chosen">
                    <input type="hidden" name="contactId" th:value="${chosenId}">
                    <p>
                        <strong th:text="${chosen.givenName()} + ' ' + ${chosen.surname()}">—</strong>
                        <span class="muted" th:text="${chosen.email()}">—</span>
                        <a th:href="@{/units/{id}(id=${unit.unitId()})}">zmień</a>
                    </p>
                </div>

                <p class="muted" th:if="${chosen == null}">— albo nowa osoba —</p>

                <div th:if="${chosen == null}" class="lead-fields">
                    <div th:replace="~{components :: field(name='givenName', label='Imię', value=null, type='text', required=true, help=null, suffix=null, error=null, inputmode=null, placeholder='Imię', autofocus=false)}"></div>
                    <div th:replace="~{components :: field(name='surname', label='Nazwisko', value=null, type='text', required=true, help=null, suffix=null, error=null, inputmode=null, placeholder='Nazwisko', autofocus=false)}"></div>
                    <div th:replace="~{components :: field(name='email', label='E-mail', value=null, type='email', required=false, help=null, suffix=null, error=null, inputmode=null, placeholder='E-mail', autofocus=false)}"></div>
                    <div th:replace="~{components :: field(name='phone', label='Telefon', value=null, type='tel', required=false, help=null, suffix=null, error=null, inputmode=null, placeholder='Telefon', autofocus=false)}"></div>
                    <!--/*
                      The one fact on this form that is genuinely the manager's to assert.
                      Defaulting it to today would have the application claim the clause was read
                      out when nobody said so — see ContactService.registerLead. Not required: an
                      unticked box is a valid, meaningful answer (anUnconfirmedClauseIsStoredAsAbsent).
                    */-->
                    <label class="lead-consent">
                        <input type="checkbox" name="infoClauseServed" value="true">
                        Przekazano klauzulę informacyjną
                    </label>
                </div>

                <div class="lead-fields">
                    <div th:replace="~{components :: field(name='willingToPay', label='Gotów płacić', value=null, type='text', required=false, help=null, suffix='zł', error=null, inputmode='decimal', placeholder=null, autofocus=false)}"></div>
                    <div th:replace="~{components :: field(name='desiredStart', label='Od kiedy', value=null, type='date', required=false, help=null, suffix=null, error=null, inputmode=null, placeholder=null, autofocus=false)}"></div>
                </div>

                <div th:replace="~{components :: btn(href=null, text='Dodaj', kind='primary')}"></div>
            </form>
        </div>
    </div>
</main>
</body>
</html>
