<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="pl"
      th:replace="~{layout :: page('Wybierz agencję — NAJEM', null, ~{::main})}">
<body>
<main>
    <h1>Wybierz agencję</h1>
    <p class="muted">
        Należysz do kilku agencji. Wskaż tę, w której chcesz teraz pracować — możesz ją zmienić
        w każdej chwili.
    </p>

    <!--/*
      A POST per choice, not a link. Choosing decides which agency every later request acts in,
      and a state change reachable by a GET is reachable by a prefetch or a restored tab.
    */-->
    <div class="card">
        <ul class="agency-list">
            <li class="agency-list__row" th:each="m : ${memberships}">
                <form th:action="@{/agencies/{id}(id=${m.workspaceId()})}" method="post">
                    <button type="submit" class="agency-list__name" th:text="${m.name()}">—</button>
                    <span th:switch="${m.role().name()}">
                        <span th:case="'ADMIN'"><span th:replace="~{components :: pill(tone='neutral', text='Administrator')}"></span></span>
                        <span th:case="'MANAGER'"><span th:replace="~{components :: pill(tone='neutral', text='Zarządca')}"></span></span>
                        <span th:case="*"><span th:replace="~{components :: pill(tone='neutral', text=${m.role().name()})}"></span></span>
                    </span>
                </form>
            </li>
        </ul>
    </div>
</main>
</body>
</html>
