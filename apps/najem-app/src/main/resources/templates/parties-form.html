<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="pl">
<body>
<!--/*
  The search-then-create block the reserve screen shows under whichever role the manager is adding
  to — tenants or guarantors, one block, never both.

  It lives in its own file rather than beside its two call sites, and that is not a matter of taste.
  A th:fragment declared inline in a page is still part of that page's document, so Thymeleaf renders
  it where it sits AND again wherever it is inserted: the screen showed the picker twice, the second
  copy orphaned below the Dalej button with no heading over it. No test caught it, because every
  assertion asked whether the form was present and none asked how many there were. A fragment in a
  file of its own is only ever rendered by an insert.

  Copied from unit.html's section.lead: a GET search (bookmarkable, changes nothing, so no CSRF
  token) plus a POST create-or-pick form. "Type something" and "nobody matched" stay two messages,
  for the reason unit.html gives — a blank term and a term that matched nothing both render zero
  hits, so the difference cannot come from the result.

  Every drafted party rides along as a hidden field on both forms. That is what makes the draft
  survive a search or an inline creation without a session.

  Reuses unit.html's lead-search / lead-hits / lead-fields / lead-consent classes (screens.css) and
  the field()/btn() fragments rather than inventing a second version of the same shape — this block
  and unit.html's "Dodaj zainteresowanego" card are the same interaction on different data.
*/-->
<div th:fragment="partiesForm" class="lead">
    <form class="lead-search" th:action="@{/units/{u}/reserve(u=${unit.unitId()})}" method="get">
        <input type="hidden" name="interestId" th:value="${interestId}">
        <input type="hidden" th:each="id : ${tenantIds}" name="tenant" th:value="${id}">
        <input type="hidden" th:each="id : ${guarantorIds}" name="guarantor" th:value="${id}">
        <input type="hidden" name="role" th:value="${role}">
        <input class="field__input" type="search" name="q" th:value="${term}" placeholder="Nazwisko albo imię">
        <div th:replace="~{components :: btn(href=null, text='Szukaj', kind='secondary')}"></div>
    </form>

    <!--/* th:if + th:replace on one element never fire together (see properties.html's note). */-->
    <div th:if="${asked and hits.isEmpty()}">
        <div th:replace="~{components :: emptyState(text='Nikogo takiego jeszcze nie znamy — wpisz dane poniżej.')}"></div>
    </div>

    <ul class="lead-hits" th:unless="${hits.isEmpty()}">
        <li th:each="hit : ${hits}">
            <a th:href="@{/units/{u}/reserve(u=${unit.unitId()}, interestId=${interestId},
                         tenant=${tenantIds}, guarantor=${guarantorIds}, role=${role}, q=${term})}
                         + '&' + ${role} + '=' + ${hit.contactId()}"
               th:text="${hit.givenName()} + ' ' + ${hit.surname()} + ' — ' + ${hit.email()}">—</a>
        </li>
    </ul>

    <form th:action="@{/units/{u}/reserve/parties(u=${unit.unitId()})}" method="post">
        <input type="hidden" name="interestId" th:value="${interestId}">
        <input type="hidden" th:each="id : ${tenantIds}" name="tenant" th:value="${id}">
        <input type="hidden" th:each="id : ${guarantorIds}" name="guarantor" th:value="${id}">
        <input type="hidden" name="role" th:value="${role}">

        <p class="muted">— albo nowa osoba —</p>

        <div class="lead-fields">
            <div th:replace="~{components :: field(name='givenName', label='Imię', value=null, type='text', required=true, help=null, suffix=null, error=null, inputmode=null, placeholder='Imię', autofocus=false)}"></div>
            <div th:replace="~{components :: field(name='surname', label='Nazwisko', value=null, type='text', required=true, help=null, suffix=null, error=null, inputmode=null, placeholder='Nazwisko', autofocus=false)}"></div>
            <div th:replace="~{components :: field(name='email', label='E-mail', value=null, type='email', required=false, help=null, suffix=null, error=null, inputmode=null, placeholder='E-mail', autofocus=false)}"></div>
            <div th:replace="~{components :: field(name='phone', label='Telefon', value=null, type='tel', required=false, help=null, suffix=null, error=null, inputmode=null, placeholder='Telefon', autofocus=false)}"></div>
        </div>
        <label class="lead-consent">
            <input type="checkbox" name="infoClauseServed" value="true">
            Przekazano klauzulę informacyjną
        </label>

        <div th:replace="~{components :: btn(href=null, text='Dodaj', kind='primary')}"></div>
    </form>
</div>
</body>
</html>
