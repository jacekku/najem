<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="pl"
      th:replace="~{layout :: page('Szukaj — NAJEM', ~{::main})}">
<body>
<main>
    <h1>Szukaj</h1>

    <form class="search" th:action="@{/search}" method="get">
        <input type="search" name="q" th:value="${term}" placeholder="Adres lub lokal" autofocus>
        <button type="submit">Szukaj</button>
    </form>

    <!--/*
      "Type something" and "nothing matched" are different answers and must not share a message.
      A blank term returns no rows, exactly as a term that matched nothing does, so the distinction
      cannot come from the result — it comes from whether anything was asked.
    */-->
    <p class="muted" th:unless="${asked}">
        Wpisz fragment adresu albo nazwę lokalu.
    </p>

    <p class="empty" th:if="${asked and hits.isEmpty()}">
        Nic nie pasuje do „<span th:text="${term}">—</span>”.
    </p>

    <!--/*
      Grouped by kind, not ranked. Reporting deliberately does not rank, and an order invented here
      would be the UI asserting a relevance it has no basis for.
    */-->
    <div th:if="${asked and !hits.isEmpty()}">
        <section th:with="properties=${hits.?[kind == 'property']}" th:unless="${properties.isEmpty()}">
            <h2>Nieruchomości</h2>
            <ul class="hits">
                <li th:each="hit : ${properties}">
                    <a th:href="@{/properties/{id}/units(id=${hit.id()})}" th:text="${hit.label()}">—</a>
                </li>
            </ul>
        </section>

        <section th:with="units=${hits.?[kind == 'unit']}" th:unless="${units.isEmpty()}">
            <h2>Lokale</h2>
            <ul class="hits">
                <!--/*
                  A unit hit links to its property's unit list — Reporting sends the parent id for
                  exactly this reason, since a unit on its own is not somewhere a person can go.
                */-->
                <li th:each="hit : ${units}">
                    <a th:href="@{/properties/{id}/units(id=${hit.propertyId()})}"
                       th:text="${hit.label()}">—</a>
                </li>
            </ul>
        </section>
    </div>
</main>
</body>
</html>
