<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="pl"
      th:replace="~{layout :: page('Szukaj — NAJEM', null, ~{::main})}">
<body>
<main>
    <h1>Szukaj</h1>

    <form class="lead-search" th:action="@{/search}" method="get">
        <input class="field__input" type="search" name="q" th:value="${term}" placeholder="Adres lub lokal" autofocus>
        <div th:replace="~{components :: btn(href=null, text='Szukaj', kind='secondary')}"></div>
    </form>

    <!--/*
      "Type something" and "nothing matched" are different answers and must not share a message.
      A blank term returns no rows, exactly as a term that matched nothing does, so the distinction
      cannot come from the result — it comes from whether anything was asked.
    */-->
    <p class="muted" th:unless="${asked}">
        Wpisz fragment adresu albo nazwę lokalu.
    </p>

    <!--/* th:if + th:replace on one element never fire together (see properties.html's note). */-->
    <div th:if="${asked and properties.isEmpty() and units.isEmpty()}">
        <div th:replace="~{components :: emptyState(text='Nic nie pasuje do „' + ${term} + '”.')}"></div>
    </div>

    <!--/*
      Grouped by kind, not ranked. Reporting deliberately does not rank, and an order invented here
      would be the UI asserting a relevance it has no basis for. The grouping is done in the
      controller: doing it with a selection expression here threw at render time and no test could
      see it, because the expression is only reached when there is something to show.
    */-->
    <div class="card" th:unless="${properties.isEmpty()}">
        <header class="card__head"><h2 class="card__title">Nieruchomości</h2></header>
        <div class="card__body">
            <ul class="lead-hits">
                <li th:each="hit : ${properties}">
                    <a th:href="@{/properties/{id}/units(id=${hit.id()})}" th:text="${hit.label()}">—</a>
                </li>
            </ul>
        </div>
    </div>

    <div class="card" th:unless="${units.isEmpty()}">
        <header class="card__head"><h2 class="card__title">Lokale</h2></header>
        <div class="card__body">
            <!--/*
              A unit hit links to its property's unit list — Reporting sends the parent id for
              exactly this reason, since a unit on its own is not somewhere a person can go.
            */-->
            <ul class="lead-hits">
                <li th:each="hit : ${units}">
                    <a th:href="@{/properties/{id}/units(id=${hit.propertyId()})}"
                       th:text="${hit.label()}">—</a>
                </li>
            </ul>
        </div>
    </div>
</main>
</body>
</html>
