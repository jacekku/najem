<!DOCTYPE html>
<!--/*
  The shell every screen renders into.

  htmx is served from this application, never from a CDN: a page that pulls its script from a
  third party is a page whose render depends on that party being reachable, in an application
  handling tenancy-scoped financial data. Pinned and verifiable — see static/vendor/README.md.

  This layout holds no workspace and no data. Screens receive a workspace; they never resolve one.
*/-->
<!--/*
  data-theme is stamped here, on the server, or left off entirely.

  Left off means "follow the operating system", which the stylesheet handles with a media query.
  Only somebody who has used the toggle gets an attribute, and then it overrides their machine.
  Resolving it here rather than in the browser is what keeps the first paint correct: a script
  that fixes the theme after the document renders is a script that flashes the wrong one first.
*/-->
<html xmlns:th="http://www.thymeleaf.org" lang="pl" th:fragment="page(title, content)"
      th:attr="data-theme=${theme}">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${title}">NAJEM</title>
    <link rel="icon" th:href="@{/favicon.svg}" type="image/svg+xml">
    <script th:src="@{/vendor/htmx.min.js}" defer></script>
    <link rel="stylesheet" th:href="@{/css/najem.css}">
</head>
<body>
<header class="masthead">
    <a class="masthead__brand" th:href="@{/}">NAJEM</a>
    <!--/*
      Which agency this request is acting in, on every screen rather than only on the home page.
      With a switcher, a screen that does not say invites acting in the wrong agency — and a
      misdirected write never collides with the correct one, so it does not announce itself.
      Handed here by the resolver; this layout still resolves nothing.
    */-->
    <span class="masthead__agency" th:if="${activeAgency}" th:text="${activeAgency}">—</span>
    <!--/*
      Boards here are eventually consistent. A stalled or lagging projector renders as a short or
      empty list, which is indistinguishable from a correct one — so a manager who has just created
      something and cannot see it has no way to tell "not yet" from "it didn't work". Saying so is
      the condition najem-pm attached to accepting an eventually consistent board (seq 110).
    */-->
    <form class="masthead__search" th:if="${activeAgency}" th:action="@{/search}" method="get">
        <input type="search" name="q" placeholder="Szukaj">
    </form>
    <span class="masthead__stale" th:if="${projectionsBehind}"
          title="Widok nadąża za zapisami z opóźnieniem — odśwież za chwilę">aktualizacja…</span>
    <!--/*
      A POST, not a link: logging out changes state, and a GET that ends a session can be triggered
      by anything that fetches a URL — a prefetch, an image tag on another site. Thymeleaf injects
      the CSRF token, which is the same protection the agency switcher relies on.

      Rendered only when somebody is actually signed in. Under permit-all there is no session to
      end, and a button that cannot do anything is a bug report waiting to be filed.
    */-->
    <!--/*
      Light or dark, chosen explicitly. A POST for the same reason sign-out is one: it sets a
      cookie, and a GET that changes state can be fired by anything that fetches a URL.

      It carries the current path so the switch keeps you on the screen you were reading rather
      than returning you home mid-reconciliation. That field is attacker-controllable and becomes
      a redirect target, so ThemeController validates it again rather than trusting this.

      Rendered on every screen including before sign-in: somebody who cannot read the login page
      in the dark cannot get far enough to fix it afterwards.
    */-->
    <form class="masthead__theme" th:action="@{/theme}" method="post">
        <input type="hidden" name="theme" th:value="${themeToOffer}">
        <input type="hidden" name="return" th:value="${currentPath}">
        <button type="submit"
                th:title="${themeToOffer == 'dark'} ? 'Przełącz na ciemny motyw'
                                                    : 'Przełącz na jasny motyw'"
                th:text="${themeToOffer == 'dark'} ? 'Ciemny' : 'Jasny'">Ciemny</button>
    </form>
    <form class="masthead__signout" th:if="${signedInAs}" th:action="@{/logout}" method="post">
        <button type="submit" th:title="'Zalogowano jako ' + ${signedInAs}">Wyloguj</button>
    </form>
</header>
<main th:replace="${content}">
    <p>Screen content renders here.</p>
</main>
</body>
</html>
