<!DOCTYPE html>
<!--/*
  Signed in at Keycloak, but no NAJEM account exists for that subject.

  Not the shared layout: that shell asks the seam for an agency, and this person has no account
  for an agency to hang off. It is also the sibling of no-agency.html rather than a copy of it —
  the two look alike and mean different things. There, an account exists and belongs to no agency
  yet. Here, there is no account at all, and one is never created by arriving with a valid token.
*/-->
<html xmlns:th="http://www.thymeleaf.org" lang="pl">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Konto niezaproszone — NAJEM</title>
    <link rel="icon" th:href="@{/favicon.svg}" type="image/svg+xml">
    <link rel="stylesheet" th:href="@{/css/tokens.css}">
    <link rel="stylesheet" th:href="@{/css/base.css}">
    <link rel="stylesheet" th:href="@{/css/layout.css}">
    <link rel="stylesheet" th:href="@{/css/components.css}">
    <link rel="stylesheet" th:href="@{/css/screens.css}">
</head>
<body class="auth-page">
<main class="auth-panel card">
    <div class="auth-mark" aria-hidden="true">N</div>
    <h1>NAJEM</h1>
    <p>Zalogowano, ale to konto nie ma jeszcze dostępu do NAJEM.</p>
    <p class="muted">
        NAJEM działa na zaproszenia. Poproś osobę zarządzającą agencją o zaproszenie na ten
        adres — konto powstaje dopiero po jego przyjęciu.
    </p>
    <!--/*
      A way out that is not the browser's back button. Without it the only action available to
      somebody who signed in as the wrong person is to close the tab.
    */-->
    <form th:action="@{/logout}" method="post">
        <div th:replace="~{components :: btn(href=null, text='Wyloguj się', kind='secondary')}"></div>
    </form>
</main>
</body>
</html>
