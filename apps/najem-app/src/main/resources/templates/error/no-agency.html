<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="pl"
      th:replace="~{layout :: page('Brak agencji — NAJEM', null, ~{::main})}">
<body>
<main>
    <h1>Nie należysz jeszcze do żadnej agencji</h1>
    <div class="card">
        <div class="card__body error-card__body">
            <p>
                NAJEM działa na zaproszenia. Konto już istnieje, ale nie jest jeszcze przypisane do agencji —
                poproś administratora swojej agencji o zaproszenie.
            </p>
            <p class="muted">
                Gdy zaproszenie zostanie przyjęte, ten ekran zmieni się w ekran agencji.
            </p>
        </div>
    </div>
</main>
</body>
</html>
