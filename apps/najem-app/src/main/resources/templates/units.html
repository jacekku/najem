<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="pl"
      th:replace="~{layout :: page('Lokale — NAJEM', ~{::main})}">
<body>
<main>
    <h1>Lokale</h1>

    <p class="empty" th:if="${units.isEmpty()}">
        Ta nieruchomość nie ma jeszcze żadnych lokali.
    </p>

    <table class="board" th:unless="${units.isEmpty()}">
        <thead>
        <tr>
            <th>Lokal</th>
            <th class="amount">Czynsz bazowy</th>
            <th>Ogłoszenie</th>
            <th>Najem</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="unit : ${units}">
            <td th:text="${unit.name()}">—</td>
            <!--/*
              The format is STATED, not inherited. Thymeleaf's default takes grouping and the
              decimal separator from the server's locale, so the same code renders 2,500.00 on one
              machine and 2 500,00 on another, with tests green either way when the test JVM shares
              the locale (@najem-fakebank, najem-build seq 347). That is the systemDefaultZone()
              defect wearing a template's clothes. Polish convention, matching the bank UI.
            */-->
            <td class="amount"
                th:text="${#numbers.formatDecimal(unit.baseRent(), 1, 'WHITESPACE', 2, 'COMMA')}">—</td>
            <!--/*
              This column is about MARKETING, not occupancy, and the two must not be merged
              (najem-pm's ruling, carried into RUNNING.md at d006c90): a let unit is legitimately
              still `inventory`, because it is not being advertised. Whether a unit is let is the
              next column, from currentTenancyId. An earlier version headed this "Status", which
              invites exactly the reading that a let flat is standing empty.

              Still three states, not two: never advertised is not the same as deliberately
              withdrawn. The projection decides which; this only labels it.
            */-->
            <td>
                <span class="state" th:classappend="'state--' + ${unit.marketState()}"
                      th:switch="${unit.marketState()}">
                    <span th:case="'open'">Ogłoszony</span>
                    <span th:case="'closed'">Wycofany z oferty</span>
                    <span th:case="'inventory'">Nieogłoszony</span>
                    <span th:case="*" th:text="${unit.marketState()}">—</span>
                </span>
            </td>
            <td>
                <a th:if="${unit.currentTenancyId() != null}"
                   th:href="@{/tenancies/{id}/timeline(id=${unit.currentTenancyId()})}">Najem bieżący</a>
                <span th:if="${unit.currentTenancyId() == null}" class="vacant">Pustostan</span>
                <a th:if="${unit.nextTenancyId() != null}" class="upcoming"
                   th:href="@{/tenancies/{id}/timeline(id=${unit.nextTenancyId()})}">· nadchodzący</a>
            </td>
        </tr>
        </tbody>
    </table>
</main>
</body>
</html>
