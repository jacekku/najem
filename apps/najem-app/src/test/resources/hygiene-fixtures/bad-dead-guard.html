<!DOCTYPE html>
<!--/*
  DELIBERATELY BROKEN FIXTURE — do not fix, do not use as a real template.

  Exists only so TemplateHygieneTest.noElementCarriesBothThReplaceAndAGuard has something it is
  known to have to catch, on every run, forever — proving the tripwire still bites rather than
  merely having bitten once on the day it was written (refactoring.md rule 21). Lives under
  src/test/resources, never under src/main/resources/templates, so Thymeleaf's template resolver
  never sees it and nothing can accidentally render it.

  Carries TWO violations of this tripwire, and the difference between them is the point.

  The first is the plain shape: th:if and th:replace on the same element, which Thymeleaf evaluates
  in the wrong order for the guard to matter (th:replace at precedence 100, th:if at 300 —
  substitution happens first).

  The second is the same defect on an element whose attribute value contains '<' and '>'. That is
  the case the tripwire's tag pattern could not SEE until the final fix round: the old pattern was
  <[a-zA-Z][^<>]*>, whose character class stops at the '<' inside the attribute with no '>' yet
  reached, so the entire element was skipped and the scanner reported clean. Two elements in the
  real tree (components.html's stepRail, comparing iter.count < current) were being skipped exactly
  this way. This second specimen is what keeps that hole shut: if anyone narrows the pattern back,
  the assertion naming this line goes red rather than the file merely still being caught by the
  first specimen. A fixture that can be satisfied by one of its two specimens does not prove the
  other one is scanned.

  Isolated from Tripwires A and C on purpose — no hex colour, no style attribute, no px, and every
  th:* expression here carries zero '__' — so a change to this file's outcome can only ever be
  attributed to Tripwire B.
*/-->
<html xmlns:th="http://www.thymeleaf.org" lang="pl">
<body>
<div th:if="${units.isEmpty()}" th:replace="~{components :: emptyState(text='Brak')}"></div>
<div th:if="${iter.count < current}" th:replace="~{components :: emptyState(text='Brak')}"></div>
</body>
</html>
