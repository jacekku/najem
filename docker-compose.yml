services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: najem
      POSTGRES_USER: najem
      POSTGRES_PASSWORD: najem
    ports:
      - "5432:5432"

  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      KC_HTTP_PORT: 8180
    volumes:
      - ./docker/keycloak:/opt/keycloak/data/import:ro
    ports:
      - "8180:8180"
